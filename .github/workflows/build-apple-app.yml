name: Build Apple App
# Named after the dispatching correlationId so the Luxi server can find this specific run via the Actions
# REST API — repository_dispatch's own response carries no run id back to the caller. Mirrors
# selail/windows-build's build-windows-app.yml exactly (see that repo for the sibling Windows pipeline).
run-name: apple-build-${{ github.event.client_payload.correlationId }}

on:
  repository_dispatch:
    types: [build-apple-app]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # A raw ${{ }} interpolation of sourceZipUrl/signingUrl into any run: step's script text would
      # otherwise be echoed verbatim in that step's own "##[group]Run ..." log line — and this is a PUBLIC
      # repo, so that log is world-readable. actions/github-script accesses the payload via the JS
      # `context` object at runtime instead of through ${{ }} pre-substitution, so nothing is interpolated
      # into this step's own visible script text; core.setSecret masks the value for every later step's
      # log output (including their own command-echo lines) from this point on. Both URLs are presigned
      # and short-lived regardless — this is defense in depth, not the only safeguard. signingUrl is only
      # present for target=ios-device (it carries the project's Apple Developer credentials — see
      # AppleBuildOrchestrator.deployViaGithubActions — never placed directly in client_payload).
      - name: Mask the source zip / signing URLs
        uses: actions/github-script@v7
        with:
          script: |
            core.setSecret(context.payload.client_payload.sourceZipUrl)
            if (context.payload.client_payload.signingUrl) {
              core.setSecret(context.payload.client_payload.signingUrl)
            }

      - name: Download source zip
        run: curl -fsSL -o source.zip "${{ github.event.client_payload.sourceZipUrl }}"

      - name: Unzip source
        run: |
          mkdir -p src
          ditto -x -k source.zip src

      - name: Download signing payload (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        run: curl -fsSL -o signing.json "${{ github.event.client_payload.signingUrl }}"

      # xcodegen is a Homebrew formula, preinstalled runners just need `brew install` (no tap needed).
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: src
        run: xcodegen generate

      # One target -> one scheme; discover it instead of hardcoding the generator's naming convention
      # (mirrors infra/prod/ios-builder/server.py's _first_scheme).
      - name: Discover the scheme
        id: scheme
        working-directory: src
        run: |
          scheme=$(xcodebuild -list -json | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project") or d.get("workspace") or {}).get("schemes", [""])[0])')
          if [ -z "$scheme" ]; then
            echo "no scheme found after xcodegen generate" >&2
            exit 1
          fi
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      # Branches only on the build-flags step — everything else (checkout, xcodegen, scheme discovery,
      # zip, upload) is shared between the two targets, mirroring how ios-builder/server.py's
      # _generate_and_build is shared between its /build and /build-macos routes.
      - name: Build (iOS Simulator)
        if: github.event.client_payload.target == 'ios-simulator'
        working-directory: src
        run: |
          xcodebuild -scheme "${{ steps.scheme.outputs.scheme }}" -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Build (macOS)
        if: github.event.client_payload.target == 'macos'
        working-directory: src
        run: |
          xcodebuild -scheme "${{ steps.scheme.outputs.scheme }}" -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      # Ad-hoc sign the macOS build so it launches locally for the end user (no Apple Developer account,
      # no notarization — v1 limitation, identical to the rented-Mac build worker today: the OS still
      # blocks first launch outright until "Open Anyway" in System Settings > Privacy & Security).
      - name: Ad-hoc codesign (macOS only)
        if: github.event.client_payload.target == 'macos'
        working-directory: src
        run: |
          app=$(find build/Build/Products/Debug -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$app" ]; then echo "no .app found under Debug" >&2; exit 1; fi
          codesign --force --deep --sign - "$app"

      # ── iOS device build: archive → sign (the project's own Apple Developer account) → export → upload ──
      # Mirrors infra/prod/ios-builder/server.py's _build_ios_device: the generated project.yml already
      # carries the real signing settings (PRODUCT_BUNDLE_IDENTIFIER/DEVELOPMENT_TEAM/MARKETING_VERSION/
      # CURRENT_PROJECT_VERSION, CODE_SIGN_STYLE=Automatic — see AppleSigningOverride), so nothing here
      # overrides them on the xcodebuild command line; this only handles the signing IDENTITY.
      #
      # A fresh ephemeral runner mints a new Apple Distribution certificate just as readily as the
      # persistent Mac worker's throwaway keychain does if none is imported first — Apple caps active
      # Distribution certs per team at ~2-3, so re-minting one on every dispatch would exhaust that cap
      # within a handful of runs. Importing signing.existingP12Base64 (when present) before the archive
      # step, then re-exporting whatever identity ends up in the keychain afterward, keeps this in lockstep
      # with the persistent worker regardless of which backend actually built a given deploy.
      - name: Prepare signing materials (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        id: signing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const signing = JSON.parse(fs.readFileSync('signing.json', 'utf8'));
            fs.writeFileSync(`AuthKey_${signing.keyId}.p8`, signing.privateKeyP8);
            if (signing.existingP12Base64) {
              fs.writeFileSync('signing-identity.p12', Buffer.from(signing.existingP12Base64, 'base64'));
            }
            const p12Password = signing.existingP12Password || crypto.randomBytes(24).toString('base64url');
            const keychainPassword = crypto.randomBytes(24).toString('base64url');
            core.setSecret(p12Password);
            core.setSecret(keychainPassword);
            fs.writeFileSync('p12-password.txt', p12Password);
            // method=app-store-connect (NOT the deprecated "app-store"); destination=upload does BOTH
            // packaging and the TestFlight/App Store Connect upload as part of -exportArchive.
            // manageAppVersionAndBuildNumber=false is load-bearing -- it defaults to true since Xcode 13
            // and, left on, silently rewrites CFBundleVersion to whatever Transporter thinks is "next
            // valid," decoupling what ships from AppleDeveloperAccount's own tracked build-number counter.
            fs.writeFileSync('ExportOptions.plist', `<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key><string>app-store-connect</string>
                <key>teamID</key><string>${signing.teamId}</string>
                <key>destination</key><string>upload</string>
                <key>signingStyle</key><string>automatic</string>
                <key>manageAppVersionAndBuildNumber</key><false/>
            </dict>
            </plist>
            `);
            core.setOutput('key-id', signing.keyId);
            core.setOutput('issuer-id', signing.issuerId);
            core.setOutput('build-number', String(signing.buildNumber));
            core.setOutput('keychain-password', keychainPassword);

      - name: Set up signing keychain (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="${{ steps.signing.outputs.keychain-password }}"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          if [ -f signing-identity.p12 ]; then
            security import signing-identity.p12 -k "$KEYCHAIN" -P "$(cat p12-password.txt)" \
              -T /usr/bin/codesign -T /usr/bin/security
          fi
          # Required even on a headless runner: without this, macOS evaluates the imported key's ACL and
          # codesign hangs waiting on a keychain-access prompt that can never be answered.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          EXISTING=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

      - name: Archive (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        working-directory: src
        run: |
          xcodebuild archive -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/AuthKey_${{ steps.signing.outputs.key-id }}.p8" \
            -authenticationKeyID "${{ steps.signing.outputs.key-id }}" \
            -authenticationKeyIssuerID "${{ steps.signing.outputs.issuer-id }}"

      - name: Export & upload to App Store Connect (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$GITHUB_WORKSPACE/AuthKey_${{ steps.signing.outputs.key-id }}.p8" \
            -authenticationKeyID "${{ steps.signing.outputs.key-id }}" \
            -authenticationKeyIssuerID "${{ steps.signing.outputs.issuer-id }}"

      # Re-export whichever identity is now in the keychain -- unchanged bytes if an existing p12 was
      # reused, a freshly-minted one if this was the project's first deploy -- so the caller can persist
      # it for next time regardless of which case this was.
      - name: Export signing identity for reuse (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        run: |
          security export -k "$RUNNER_TEMP/build.keychain" -t identities -f pkcs12 \
            -P "$(cat p12-password.txt)" -o "$RUNNER_TEMP/signing-identity-out.p12"

      # No app binary to hand back for this target -- the artifact is a small JSON status blob instead
      # (AppleBuildOrchestrator.deployViaGithubActions parses it via deployOutcomeFromArtifactJson, not
      # artifactFromResponse's {"ok":..,"app":..} envelope).
      - name: Stage deploy result (iOS device only)
        if: github.event.client_payload.target == 'ios-device'
        id: app
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p12 = fs.readFileSync(`${process.env.RUNNER_TEMP}/signing-identity-out.p12`);
            const password = fs.readFileSync('p12-password.txt', 'utf8');
            fs.mkdirSync('stage', { recursive: true });
            fs.writeFileSync('stage/result.json', JSON.stringify({
              buildNumber: Number('${{ steps.signing.outputs.build-number }}'),
              signingCertificateP12: p12.toString('base64'),
              signingCertificatePassword: password,
            }));
            core.setOutput('dir', 'stage');

      # Stage the .app alone in an otherwise-empty directory (rather than pointing upload-artifact at the
      # Products dir directly, which can also contain a .dSYM or other build byproducts): upload-artifact
      # zips the CONTENTS of `path`, not path itself, so the artifact's top-level entry must be exactly
      # `<name>.app/` — nothing else — to reconstruct a valid double-clickable/Appetize-loadable bundle.
      - name: Stage the built .app
        if: github.event.client_payload.target != 'ios-device'
        id: app
        working-directory: src
        run: |
          if [ "${{ github.event.client_payload.target }}" = "macos" ]; then
            product_dir=build/Build/Products/Debug
          else
            product_dir=build/Build/Products/Debug-iphonesimulator
          fi
          app=$(find "$product_dir" -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$app" ]; then echo "no .app found under $product_dir" >&2; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp -R "$app" "$GITHUB_WORKSPACE/stage/"
          echo "dir=stage" >> "$GITHUB_OUTPUT"

      # Downloading this artifact via the Actions API returns a zip whose sole top-level entry is either
      # `<name>.app/` (ios-simulator/macos) or `result.json` (ios-device) — exactly the shape
      # AppleBuildOrchestrator expects for each kind, no unwrapping needed server-side. Mirrors
      # selail/windows-build's build-windows-app.yml (uploads its unzipped `publish/` dir the same way).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.correlationId }}
          path: ${{ steps.app.outputs.dir }}
          retention-days: 1
          if-no-files-found: error
